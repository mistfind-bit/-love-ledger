<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="愛心記帳"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>愛心記帳</title></head><body><main class="app"><header><button>☰</button><b>月</b><h2>2026 年 9 月</h2><span></span><button id="budgetBtn">▦</button></header><section class="sum"><div><small>月支出</small><strong id="exp">$0</strong></div><div class="right"><small>月收入</small><strong id="inc">$0</strong></div></section><section class="hero"><div class="donut" id="donut"><div class="hole"><div>♡ 月結餘</div><strong id="bal">$0</strong></div></div><div class="budget"><b>當月剩餘預算</b><div><span id="remain">$0</span> / <span id="budget">$10,000</span></div><div class="bar"><i id="fill"></i></div></div></section><div class="title"><b>本月紀錄</b><span id="count">0 筆</span></div><section id="records"></section><button class="fab" id="add">＋</button></main><dialog id="entry"><form id="form"><h3>新增紀錄 ♡</h3><div class="seg"><button type="button" data-type="expense" class="active">支出</button><button type="button" data-type="income">收入</button></div><label>金額<input id="amount" type="number" min="1" required></label><label>分類<select id="category"><option>早餐</option><option>午餐</option><option>晚餐</option><option>交通</option><option>購物</option><option>投資</option><option>股市虧</option><option>薪資</option><option>其他</option></select></label><label>備註<input id="note"></label><label>日期<input id="date" type="date" required></label><button class="save">儲存 ♡</button><button type="button" id="close">取消</button></form></dialog><dialog id="budgetDlg"><form id="budgetForm"><h3>本月預算</h3><label>預算金額<input id="budgetInput" type="number" min="0"></label><button class="save">儲存</button><button type="button" id="closeBudget">取消</button></form></dialog><script src="app.js"></script></body></html>
