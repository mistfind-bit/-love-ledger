{l:"l4",k:"idiom",q:"Let's get the ball rolling! 意思最接近？",c:["開始行動吧","去踢球吧","把球藏起來","停止遊戲"],a:0,e:"get the ball rolling = 讓事情開始進行。"}
];

const clozes = [
{title:"Lesson 2 明信片",text:"Hello Tina, My name is Annie. I am a junior high school student from the __1__. Walt Disney World is my favorite theme __2__. Mickey Mouse is my favorite cartoon __3__. Come and have a great __4__!",ans:["usa","park","star","time"],help:"提示：USA / park / star / time"},
{title:"Lesson 3 Potluck",text:"Hey everyone, Please come to my __1__ for a potluck. Please bring your favorite __2__ and wear something from your __3__. Don't bring any __4__. Let's have __5__!",ans:["house","dish","country","drinks","fun"],help:"提示：house / dish / country / drinks / fun"},
{title:"Lesson 4 房子位置",text:"There is a TV in the living room. There is a brown rabbit __1__ the hat. The garage is __2__ the house. A gift is __3__ a chair.",ans:["under","next to","under"],help:"提示：under / next to"}
];

let state = JSON.parse(localStorage.getItem("xiaMiEnglishProgress")||'{"done":0,"correct":0,"wrong":{},"seen":{},"today":0}');
let currentView="home", selectedLesson="all";

function save(){localStorage.setItem("xiaMiEnglishProgress",JSON.stringify(state));document.getElementById("streak").textContent="今日："+(state.today||0)+" 題";}
let speechReady=false;
function getVoice(lang){
  const vs=speechSynthesis.getVoices();
  return lang==="zh-TW"
    ? (vs.find(v=>v.lang==="zh-TW")||vs.find(v=>v.lang.startsWith("zh")))
    : (vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en")));
}
function speak(text,lang){
  if(!("speechSynthesis" in window)){alert("這個瀏覽器目前不支援朗讀功能。請改用 Chrome 或 Edge。");return;}
  const run=()=>{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;
    const pref=getVoice(lang); if(pref)u.voice=pref;
    u.rate=.88;u.pitch=1;u.volume=1;
    u.onerror=(e)=>{console.error("TTS error",e);alert("朗讀啟動失敗，請先點一下頁面後再試，或改用 Chrome / Edge。");};
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  };
  if(speechSynthesis.getVoices().length){run();}
  else{
    const once=()=>{speechSynthesis.removeEventListener("voiceschanged",once);run();};
    speechSynthesis.addEventListener("voiceschanged",once);
    setTimeout(run,500);
  }
}
function encSpeech(s){return encodeURIComponent(s).replace(/'/g,"%27");}
function lessonHTML(key){
 const L=lessons[key];
 return '<div class="hero"><h1>'+L.title+'</h1><div class="sub">先看、先聽、理解後再做題，不急著背。</div><div class="row" style="margin-top:10px"><button class="btn light" onclick="speak('Hello, Xiamie! Let us learn English together.','en-US')">🔊 測試英文</button><button class="btn light" onclick="speak('蝦米，我們一起學英文吧！','zh-TW')">🔊 測試中文</button></div></div>'+
 L.sections.map(s=>'<section class="lessonblock"><h2>'+s[0]+'</h2>'+s[1].map(x=>'<div class="line"><div class="row"><span class="en">'+x[0]+'</span><button class="speak" onclick="speak(decodeURIComponent(\''+encSpeech(x[0])+'\'),\'en-US\')">🔊 英</button><button class="speak" onclick="speak(decodeURIComponent(\''+encSpeech(x[1])+'\'),\'zh-TW\')">🔊 中</button></div><div class="zh">'+x[1]+'</div></div>').join('')+'</section>').join('');
}
function home(){
 const pct=state.done?Math.round(state.correct/state.done*100):0;
 return '<div class="hero"><h1>蝦米今天想從哪裡開始？ 🐥📚</h1><div>目前整理到 <b>Lesson 4 P.68</b>。可以先學教材，再進自適應題庫。</div></div>'+
 '<div class="grid"><div class="card"><div class="small">累積作答</div><div class="stat">'+state.done+'</div></div><div class="card"><div class="small">正確率</div><div class="stat">'+pct+'%</div></div><div class="card"><div class="small">待複習錯題</div><div class="stat">'+Object.keys(state.wrong||{}).filter(k=>state.wrong[k]>0).length+'</div></div></div>'+
 '<div class="lessonblock"><h2>學習順序</h2><div class="grid">'+Object.keys(lessons).map(k=>'<div class="card"><h3>'+lessons[k].title.split("｜")[0]+'</h3><div class="small">'+lessons[k].title+'</div><br><button class="btn secondary" onclick="go(\''+k+'\')">開始這單元</button></div>').join('')+'</div></div>'+
 '<div class="note">💡 這版先把目前收到的 P.3–68 整理成可用教學系統。Lesson 4 後半還沒收到，所以不亂補不存在的課本內容。</div>';
}
let currentQ=null;
function pickQuestion(){
 const pool=questions.filter(q=>selectedLesson==="all"||q.l===selectedLesson);
 const weighted=[];
 pool.forEach((q,i)=>{const id=questions.indexOf(q);let w=1+(state.wrong[id]||0)*4+(state.seen[id]?0:3);for(let n=0;n<w;n++)weighted.push(q)});
 return weighted[Math.floor(Math.random()*weighted.length)];
}
function practice(){
 return '<div class="hero"><h1>🎯 自適應練習</h1><div>錯題與沒做過的題目會比較容易再次出現。</div></div>'+
 '<div class="row"><label>範圍：</label><select id="lessonSel" onchange="selectedLesson=this.value;nextQ()"><option value="all">全部</option>'+Object.keys(lessons).map(k=>'<option value="'+k+'" '+(selectedLesson===k?'selected':'')+'>'+lessons[k].title.split("｜")[0]+'</option>').join('')+'</select><button class="btn light" onclick="nextQ()">換一題</button></div><hr><div id="quizArea"></div>';
}
function nextQ(){
 currentQ=pickQuestion();const id=questions.indexOf(currentQ);state.seen[id]=1;save();
 const a=document.getElementById("quizArea");if(!a)return;
 a.innerHTML='<div class="quizbox"><div class="small">'+lessons[currentQ.l].title+'</div><div class="qtitle">'+currentQ.q+'</div><div class="choices">'+currentQ.c.map((x,i)=>'<button class="choice" onclick="answerQ('+i+',this)">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+'</div><div class="feedback" id="feedback">選一個答案 👀</div><button class="btn secondary" onclick="nextQ()">下一題</button></div>';
}
function answerQ(i,btn){
 const id=questions.indexOf(currentQ);const all=[...document.querySelectorAll(".choice")];all.forEach(b=>b.disabled=true);
 state.done++;state.today=(state.today||0)+1;
 if(i===currentQ.a){state.correct++;btn.classList.add("ok");state.wrong[id]=Math.max(0,(state.wrong[id]||0)-1);document.getElementById("feedback").innerHTML="✅ 答對了！ "+currentQ.e;}
 else{btn.classList.add("no");all[currentQ.a].classList.add("ok");state.wrong[id]=(state.wrong[id]||0)+1;document.getElementById("feedback").innerHTML="🥺 這題先記起來："+currentQ.e;}
 save();
}
function clozeView(){
 return '<div class="hero"><h1>✍🏻 綜合克漏</h1><div>不是只按選項，要自己拼出關鍵字。</div></div>'+
 clozes.map((z,zi)=>{let t=z.text.replace(/__(\d+)__/g,(m,n)=>'<input id="c'+zi+'_'+n+'" autocomplete="off">');return '<div class="card" style="margin-bottom:14px"><h3>'+z.title+'</h3><div class="cloze">'+t+'</div><div class="small">'+z.help+'</div><br><button class="btn" onclick="checkCloze('+zi+')">檢查</button> <span id="cr'+zi+'"></span></div>'}).join('');
}
function checkCloze(zi){const z=clozes[zi];let ok=0;z.ans.forEach((a,i)=>{const el=document.getElementById("c"+zi+"_"+(i+1));if(el&&el.value.trim().toLowerCase()===a.toLowerCase()){ok++;el.style.borderColor="#58a87c"}else if(el)el.style.borderColor="#d26d6d"});document.getElementById("cr"+zi).textContent="答對 "+ok+" / "+z.ans.length;}
function report(){
 const pct=state.done?Math.round(state.correct/state.done*100):0;
 const wrong=Object.entries(state.wrong||{}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 return '<div class="hero"><h1>📊 學習報告</h1></div><div class="grid"><div class="card"><div class="small">累積作答</div><div class="stat">'+state.done+'</div></div><div class="card"><div class="small">正確</div><div class="stat">'+state.correct+'</div></div><div class="card"><div class="small">正確率</div><div class="stat">'+pct+'%</div></div></div><section class="lessonblock"><h2>錯題優先清單</h2>'+(wrong.length?wrong.slice(0,10).map(x=>'<div class="line"><b>'+questions[x[0]].q+'</b><div class="small">目前錯題權重：'+x[1]+' ｜ '+questions[x[0]].e+'</div></div>').join(''):'<div class="note">目前沒有待複習錯題 ✨</div>')+'</section>';
}
function render(){
 document.querySelectorAll(".side button[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
 const m=document.getElementById("main");
 if(currentView==="home")m.innerHTML=home();
 else if(lessons[currentView])m.innerHTML=lessonHTML(currentView);
 else if(currentView==="practice"){m.innerHTML=practice();setTimeout(nextQ,0)}
 else if(currentView==="cloze")m.innerHTML=clozeView();
 else if(currentView==="report")m.innerHTML=report();
 save();
}
function go(v){currentView=v;render();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".side button[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));
function resetProgress(){if(confirm("確定要清除蝦米目前的本機學習紀錄嗎？")){state={done:0,correct:0,wrong:{},seen:{},today:0};save();render()}}
save();render();
</script>
</body>
