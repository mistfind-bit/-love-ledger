lessons.l5={"title":"Lesson 5｜My Friend Is Showing Me Around｜P.81–98","color":"#4777b8","sections":[["Get Ready｜台南景點",[["Anping Old Street","安平老街"],["Blueprint Cultural and Creative Park","藍晒圖文創園區"],["National Cheng Kung University","國立成功大學"],["Chihkan Tower","赤崁樓"],["Confucius Temple","孔廟"]]],["Dialogue｜Night Market",[["What are you doing?","你正在做什麼？"],["I'm having breakfast with your Aunt May.","我正在和你的 May 阿姨吃早餐。"],["I'm at a big night market in Tainan now.","我現在在台南一個大夜市。"],["Ted is showing me around.","Ted 正帶我四處參觀。"],["There are so many fun games here!","這裡有好多有趣的遊戲！"],["Some people are playing pinball, and some kids are playing ring toss.","有些人在玩彈珠檯，有些小孩在玩套圈圈。"],["Take a bite.","咬一口試試。"]]],["Words｜核心字彙",[["night market, video call, breakfast, aunt","夜市、視訊電話、早餐、阿姨／姑姑／伯母"],["many, people, kid, snack, enjoy","許多的、人們、小孩、小吃、享受"],["show ... around","帶……參觀"]]],["Word Power｜戶外活動",[["grass, line up, picnic, feed","草地、排隊、野餐、餵食"],["take pictures, camera, paint, puppy","拍照、照相機、畫畫、幼犬"]]],["Reading｜A Museum for All",[["The Chimei Museum is a great place.","奇美博物館是一個很棒的地方。"],["Inside the museum, there are shops, restaurants, and showrooms.","館內有商店、餐廳與展示廳。"],["Some people are looking at the artworks.","有些人正在欣賞藝術品。"],["Outside the museum, there is a bridge and a beautiful meadow.","博物館外有橋和美麗的草坪。"],["Ted and Matt are taking selfies.","Ted 和 Matt 正在自拍。"],["It is a museum for all.","這是一座適合所有人的博物館。"]]],["Grammar A/B｜現在進行式",[["I am reading.","我正在閱讀。"],["Are you reading? Yes, I am.","你正在閱讀嗎？是的。"],["What are you doing now?","你現在正在做什麼？"],["She is taking a selfie.","她正在自拍。"],["They are picnicking.","他們正在野餐。"],["do → doing / write → writing / sit → sitting","V-ing：直接加 ing／去 e 加 ing／重複字尾加 ing。"]]],["Grammar C｜時間",[["What time is it?","現在幾點？"],["It's six fifteen.","現在六點十五分。"],["a quarter past four","四點十五分"],["half past four","四點半"],["a quarter to five","四點四十五分"],["five o'clock","五點整"]]],["Fun with Sounds",[["ago / nose / coat / low","母音音組練習。"],["all / daughter / saw / bought","母音音組練習。"],["late lessons.l6={"title":"Lesson 6｜We Can Save the Earth｜P.99–114","color":"#386faa","sections":[["Get Ready｜Superheroes",[["Who is his superhero?","誰是他的超級英雄？"],["What can the superhero do?","這位超級英雄會做什麼？"],["He can run very fast.","他可以跑得非常快。"]]],["Dialogue｜Super 4",[["The Earth is in danger. Please help us.","地球有危險，請幫幫我們。"],["I am strong. I can move anything!","我很強壯，我可以移動任何東西！"],["I can run very fast!","我可以跑得非常快！"],["No one can catch me.","沒有人追得上我。"],["I can freeze anything!","我可以把任何東西凍結。"],["Let's save the world now!","我們現在就去拯救世界吧！"],["No sweat!","小事一樁！"]]],["Words｜核心字彙",[["attack, Earth, member, move, anything","攻擊、地球、成員、移動、任何事情"],["mountain, fast, queen, even, save","山、快速地、皇后、甚至、拯救"],["danger, flash, freeze, ocean","危險、閃光、結冰、海洋"]]],["Word Power｜地球",[["sun, river, lake, rainbow","太陽、河流、湖泊、彩虹"],["island, sea, moon, star","島嶼、海洋、月亮、星星"]]],["Reading｜The Solomon Islands",[["The Solomon Islands are in trouble.","索羅門群島正面臨麻煩。"],["The Earth is too hot, and the ice is melting.","地球太熱，冰正在融化。"],["The sea level is rising.","海平面正在上升。"],["Please move the houses to a safe place.","請把房子移到安全的地方。"],["Please tell the world about our problem.","請把我們的問題告訴全世界。"]]],["Post-reading｜Save the Earth",[["turn off the lights","關燈"],["take the metro","搭捷運"],["recycle","做回收"],["save water","省水"],["cut down food waste","減少廚餘"],["use cloth shopping bags","使用布製購物袋"]]],["Grammar A/B｜can / can't",[["Can you cook? Yes, I can.","你會煮飯嗎？是的，我會。"],["Fish can't walk.","魚不會走路。"],["What can the parrot do?","鸚鵡會做什麼？"],["It can sing.","牠會唱歌。"],["What can your sister do?","你姊妹會做什麼？"],["She can run very fast.","她可以跑得很快。"]]],["Fun with Sounds",[["hi / bike / lie / high / fly","雙母音 /aɪ/。"],["house / power / loud / how","雙母音 /aʊ/。"],["boil / boy / join / toy","雙母音 /ɔɪ/。"],["happy / watch / yes","h / w / y 子音。"]]]]};
lessons.review2={"title":"Review II｜Lesson 3–4｜P.77–80","color":"#3b9277","sections":[["Build Your Vocabulary",[["fork / chopsticks / spoon / knife","餐具分類複習。"],["kitchen / living room","房間位置複習。"],["jacket / swimming pool","依圖片找不合理物品。"]]],["Grow Your Grammar",[["Please try it again.","肯定祈使句。"],["Please don't be late.","否定祈使句。"],["There is a man in front of my house.","There is 單數。"],["There are two monkeys in the tree.","There are 複數。"]]],["Power Up Your Reading｜Cooking Classes",[["Wear a mask. Wash your hands. Keep the kitchen clean.","烹飪課該做的事。"],["Do NOT run. Do NOT bring snacks or drinks.","烹飪課不該做的事。"]]]]};
lessons.reading1={"title":"Reading Corner I｜Taipei Zoo｜P.79–80","color":"#419477","sections":[["Taipei Zoo Map",[["Animals of Taiwan / Panda House / Zebra Park / Bird Garden / Elephant Forest","閱讀地圖與方位。"]]],["Class 103 Field Trip",[["October 12, 08:30–16:00","校外教學日期與時間。"],["Bring a lunch, NT$100, and a jacket.","帶午餐、100 元與外套。"],["Don't run at the zoo.","不要在動物園跑。"],["Don't play with animals at the zoo.","不要在動物園和動物玩。"]]]]};
lessons.review3={"title":"Review III｜Lesson 5–6｜P.115–116","color":"#4477b5","sections":[["Build Your Vocabulary",[["star / river / lake / rainbow / moon / island / sun / mountain","地球與自然字彙複習。"]]],["Grow Your Grammar",[["I am studying at school.","現在進行式。"],["What time is it? It's ten fifteen.","時間問答。"],["I can / can't dance.","can / can't 能力。"],["Can I use your bike?","can 請求許可。"]]],["Power Up Your Reading",[["There is just one Earth.","地球只有一個。"],["You can save water and plant a tree.","可以省水、種樹。"],["Recycle things. Don't throw them away.","回收物品，不要隨意丟棄。"]]]]};
lessons.reading2={"title":"Reading Corner II｜P.117–118","color":"#4f7cae","sections":[["Dream Museum",[["Read opening hours, closed days, and ticket prices.","讀懂開館時間、休館日與票價。"]]],["The Best Grass Concert",[["Music × Food × Show × Picnic × Fun","從活動海報找日期、時間與地點。"],["Use Brian's schedule to decide when he can enjoy the concert.","配合行程表判斷可參加時間。"]]]]};
lessons.learning={"title":"Learning Corner｜P.121–127","color":"#578d5d","sections":[["1. I Am Yeti",[["The mountain is my home.","山是我的家。"],["I am tall and strong, but I am not a bear.","我又高又壯，但我不是熊。"],["My hair is white and long.","我的毛是白色而且很長。"]]],["2. A Postcard from India",[["Amit writes about the Taj Mahal.","Amit 介紹泰姬瑪哈陵。"],["It can look pink, white, or golden at different times.","不同時間看起來會呈現不同顏色。"]]],["3. Invitation Card",[["Date / Place / Time","練習讀邀請卡的日期、地點與時間。"],["Please bring a dish. Please be on time.","讀懂活動規則。"]]],["4. Dr. Wildman's Diary",[["Gift hunts are fun!","尋寶很好玩。"],["The thank-you card is on my table now.","感謝卡現在在桌上。"]]],["5. We're at Shilin Night Market",[["There is delicious food all around us.","四周都有美味食物。"],["You can also try oyster noodles, stinky tofu, and bubble milk tea.","也可以試蚵仔麵線、臭豆腐和珍珠奶茶。"]]],["6. More about Super 4",[["Super 4 members are saving people from a flood.","Super 4 正在洪水中救人。"],["Speedman can take people to a safe place in the blink of an eye.","Speedman 能非常快速地把人帶到安全處。"]]]]};

Object.entries(vocabBanks).forEach(function(pair){

   let choices=rotateChoices([zh].concat(distract),i%4);
   questions.push({l:lesson,k:"vocab",q:word+" 的中文意思是？",c:choices,a:choices.indexOf(zh),e:word+" = "+zh+"。"});

 });
});

let voiceCache=[];
function refreshVoices(){
 if(!("speechSynthesis" in window))return;
 voiceCache=speechSynthesis.getVoices()||[];
 const box=document.getElementById("voiceInfo");
 if(box){
  const en=voiceCache.find(v=>v.lang==="en-US")||voiceCache.find(v=>v.lang==="en-GB")||voiceCache.find(v=>v.lang&&v.lang.startsWith("en"));
  const zh=voiceCache.find(v=>v.lang==="zh-TW")||voiceCache.find(v=>v.lang&&v.lang.startsWith("zh"));
  box.textContent="語音 "+voiceCache.length+" 個｜英："+(en?en.name:"使用系統預設")+"｜中："+(zh?zh.name:"使用系統預設");
 }
}

let speechToken=0;
function speak(text,lang){
 if(!("speechSynthesis" in window)){alert("這個瀏覽器沒有提供語音功能。");return}
 const syn=window.speechSynthesis;
 const raw=String(text==null?"":text).trim();
 if(!raw)return;
 // Keep the working test-button path simple: one utterance, synchronously from the tap.
 // On iPhone/iPad Safari, cancel/resume immediately before speak can swallow some utterances.
 const u=new SpeechSynthesisUtterance(raw);
 u.lang=lang;u.volume=1;u.pitch=1;u.rate=lang==="zh-TW"?.92:.84;
 const vs=syn.getVoices()||voiceCache||[];
 const pref=lang==="zh-TW"?(vs.find(v=>v.lang==="zh-TW")||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("zh"))):(vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en")));
 if(pref)u.voice=pref;
 u.onerror=function(e){
  console.warn("TTS error",e);
  const box=document.getElementById("voiceInfo");
  if(box)box.textContent="這一句播放失敗："+(e.error||"unknown")+"。";
 };
 syn.speak(u);
}

let currentQ=null;
let recentQuestionIds=[];
function pickQuestion(){
 let pool=questions.filter(q=>selectedLesson==="all"||q.l===selectedLesson);
 if(!pool.length)pool=questions;
 let weighted=[];
 pool.forEach(q=>{const id=questions.indexOf(q);let w=1+(state.wrong[id]||0)*5+(state.seen[id]?0:4);if(q.t==="input")w+=2;if(recentQuestionIds.includes(id))w=0;for(let n=0;n<w;n++)weighted.push(q)});
 if(!weighted.length)weighted=pool;
 const q=weighted[Math.floor(Math.random()*weighted.length)];
 const id=questions.indexOf(q);recentQuestionIds.push(id);if(recentQuestionIds.length>6)recentQuestionIds.shift();
 return q;
}
